[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agents"
description = "A hierarchical multi-agent system for solving CTF challenges."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "CTF Agents Team" }]
keywords = ["ctf", "security", "multi-agent", "capture-the-flag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core runtime. Everything here is imported at module load somewhere on the
# default `ctf-agents` path, so absence is an ImportError, not a lost playbook.
# Anything only reached lazily inside a playbook belongs in an extra below.
dependencies = [
    "pyyaml>=6.0",              # core/utils/security.py
    "python-dotenv>=1.0.0",     # core/decision_engine/llm_reasoner.py
    "pydantic>=2.7",            # core/reporting/models.py
    "aiohttp>=3.9.0",           # core/reporting/server.py
    "requests>=2.31.0",         # 10 specialists / tools
    "openai>=1.40.0",           # llm_reasoner (also backs nvidia + ollama)
    "anthropic>=0.40.0",        # llm_reasoner
    "google-genai>=1.0.0",      # llm_reasoner, via importlib.import_module
    "pycryptodome>=3.19.0",     # crypto + reverse playbooks
    "sympy>=1.12",              # discrete log / factoring
    "numpy>=1.26",              # hardware_logic + embedding analogy
    "scapy>=2.5.0",             # imported at module level by forensics/networking agents
    "playwright>=1.40.0",       # browser tool, constructed by every CLI entry point
]

[project.optional-dependencies]
# Lattice reduction for Coppersmith / RSA partial-key recovery. Split out
# because fpylll needs a compiler and GMP/MPFR; the rest of the crypto
# specialist works without it. check_setup.py reports when it is missing.
lattice = [
    "fpylll>=0.6.4",
    # 1.12.6 is Python >=3.12 only; 1.12.5 is the newest release that still
    # covers 3.10/3.11, so this floor keeps the extra installable across the
    # whole supported matrix.
    "cysignals>=1.12.5",
]
blockchain = [
    "web3>=7.0.0",
    "py-solc-x>=2.0",
]
ml = [
    "gensim>=4.3.0",            # drags SciPy; only used by embedding-analogy challenges
]
reversing = [
    "pwntools>=4.11.0",
    "z3-solver>=4.12.0",
    "capstone>=5.0.0",
    "unicorn>=2.0.0",
]
forensics = [
    "pykeepass>=4.1.1",
    "pypdf>=5.0.0",
]
all = [
    "ctf-agents[lattice]",
    "ctf-agents[blockchain]",
    "ctf-agents[ml]",
    "ctf-agents[reversing]",
    "ctf-agents[forensics]",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
lint = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
dev = [
    "ctf-agents[all]",
    "ctf-agents[test]",
    "ctf-agents[lint]",
]

[project.scripts]
ctf-agents = "ask:cli"
ctf-agents-run = "main:cli"
ctf-agents-campaign = "campaign:main"
ctf-agents-check = "check_setup:check"
ctf-agents-report = "reporting_server:main"

[project.urls]
Homepage = "https://github.com/rmjohnson12/CTF_Agents"
Documentation = "https://github.com/rmjohnson12/CTF_Agents/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "core._version.__version__" }

[tool.setuptools]
py-modules = ["ask", "main", "campaign", "check_setup", "reporting_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "tools*", "integrations*", "config*", "challenges"]
exclude = [
    "tests*", "docs*", "examples*", "logs*", "reports*", "results*",
    "runs*", "shared*", "challenges.*",
]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv", "runs", "results", "reports", "logs",
    "challenges/local", "challenges/active",
    # Vendored from the MicroPython project (MIT). Kept byte-identical so it
    # can be re-synced upstream; not ours to restyle.
    "tools/reverse/mpy",
]

[tool.ruff.lint]
# Deliberately narrow to start: real defects, not style churn across the
# 2,700-line specialists. Widen as the playbook split lands.
#   E501  line length     - would touch nearly every specialist
#   F401  unused import   - re-exports in __init__.py are load-bearing
#   B905  zip() strict=   - 12 sites; adding strict= changes behavior, so it
#                           needs per-call review rather than a blanket fix
#   I     import sorting  - 124 sites; defer until the playbook split lands
#                           so the two diffs do not collide
select = ["E9", "F", "B"]
ignore = ["E501", "F401", "B905"]

[tool.ruff.lint.per-file-ignores]
# Tests bind results they deliberately do not assert on, and use bare asserts.
"tests/**" = ["B011", "F841"]

[tool.mypy]
python_version = "3.10"
files = ["core"]
# core/ is the beachhead. Imports into tools/ and agents/ are resolved for
# types but not themselves reported yet; widen `files` as they are cleaned up.
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# Not strict yet: core/ is the beachhead, specialists come later.
check_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_llm: opt-in tests that call the configured live LLM provider",
]
