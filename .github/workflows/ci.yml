name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The offline-suite contract. tests/conftest.py already strips every provider
  # variable per-test; this states the intent at the job level and also covers
  # import-time code that runs during collection, outside any fixture.
  LLM_PROVIDER: none

jobs:
  frozen-lock:
    name: frozen uv lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - name: Verify and install from the frozen lock
        run: |
          uv lock --check
          uv sync --frozen --extra test

  python-310-smoke:
    name: Python 3.10 import + compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile supported source tree
        run: |
          python -m compileall -q \
            ask.py main.py campaign.py check_setup.py reporting_server.py \
            agents core tools integrations config challenges
      - name: Import console entry points and runtime resource
        run: |
          python -c 'from importlib import metadata, resources; assert len(metadata.distribution("ctf-agents").entry_points.select(group="console_scripts")) == 5; assert resources.files("tools.pwn").joinpath("DumpAnalysis.java").is_file()'

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build deps for fpylll
        # fpylll compiles against GMP/MPFR/MPC; without these the [lattice]
        # extra fails to build and the Coppersmith paths go untested.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libmpc-dev
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: |
          pytest -q -p no:cacheprovider \
            --cov=core --cov=agents --cov=tools --cov=integrations \
            --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/tests/packaging/verify_installed_wheel.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
